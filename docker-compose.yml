services:
  dashboard:
    build: .
    ports:
      - "3001:3001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./tools.json:/app/tools.json
      - ./tools:/app/tools
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --url http://dashboard:3001
    depends_on:
      - dashboard
    restart: unless-stopped
